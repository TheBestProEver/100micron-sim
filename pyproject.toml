[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dolle-sim"
version = "0.2.0"
description = "DOLL-E: microgravity dust-collision simulator for 100 um grains on NASA RockSat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
fast = ["numba>=0.58"]
rebound = ["rebound>=4.0"]
test = ["pytest>=7"]

[project.scripts]
dolle-sim = "dolle_sim.__main__:main"

[tool.setuptools]
packages = ["dolle_sim"]

[tool.setuptools.package-data]
dolle_sim = ["viewer_template.html"]
